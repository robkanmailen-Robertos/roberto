<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Roberto · Cantina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3E0F1C">
  <meta name="description" content="Roberto: onze wijn- en bierkelder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="seal" src="icons/logo.svg" alt="">
    <div class="wordmark"><img src="icons/wordmark.svg" alt="Roberto · Cantina · Vino &amp; Birra"></div>
    <button class="iconbtn" id="syncbtn" aria-label="Synchroniseren">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12A8 8 0 0 1 18.3 7.1"/><path d="M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></svg>
      <span class="syncdot" id="syncdot"></span>
    </button>
    <button class="iconbtn" id="settingsbtn" aria-label="Instellingen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="page" id="p-cantina"></section>
    <section class="page" id="p-bere"></section>
    <section class="page" id="p-tavola"></section>
    <section class="page" id="p-diario"></section>
  </main>

  <button class="fab" id="fab" aria-label="Fles toevoegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs">
    <button data-p="cantina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 21V9a8 8 0 0 1 16 0v12"/><path d="M4 21h16M8 21v-6a4 4 0 0 1 8 0v6"/></svg><span>Cantina</span></button>
    <button data-p="bere"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3h10l-.6 6.2A4.4 4.4 0 0 1 12 13.2a4.4 4.4 0 0 1-4.4-4L7 3z"/><path d="M7.4 7.5h9.2"/><path d="M12 13.2V20M8.5 21h7"/></svg><span>Da bere</span><b class="badge hidden" id="badge-bere">0</b></button>
    <button data-p="tavola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="6.5"/><circle cx="12" cy="13" r="3.8"/><path d="M2.5 3v6a2 2 0 0 0 2 2M4.5 3v18M21.5 3c-1.6 1-2 3-2 6h2v12"/></svg><span>A tavola</span></button>
    <button data-p="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span>Diario</span></button>
  </nav>

  <div class="sheet-bg" id="sheetbg"></div>
  <div class="toast" id="toast"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
